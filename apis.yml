aid: 247-ai
name: '[24]7.ai'
description: '[24]7.ai is a customer-experience (CX) software and services company headquartered
  in Campbell, California, operating the [24]7 Engagement Cloud — an AI-powered omnichannel
  platform spanning campaign management and intent-based targeting ([24]7 Target), conversation
  automation (Answers, Conversations, Voices natural-language IVR, async messaging), agent
  experience (Assist / Copilot console, case management, traffic management) and conversational
  intelligence (100% interaction analytics). Alongside the platform it runs managed CX and
  customer-care outsourcing operations from the US, India, the Philippines, Colombia and
  Guatemala. Platform capabilities are marketed as integrating with CRMs and back-office systems
  through "API hooks", but no public developer portal, API reference or machine-readable contract
  is published: product documentation and API access sit behind the Okta-backed customer login at
  login.247.ai, and the production API host api.247-inc.net is tenant-routed.'
